name: Production SEO monitor

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-seo:
    name: Verify production crawlability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify production SEO and redirects
        env:
          SEO_BASE_URL: https://www.melbournestructural.com.au/
          SEO_CHECK_REDIRECTS: 'true'
          SEO_EXPECTED_CANONICAL: https://www.melbournestructural.com.au/
        run: node scripts/check-seo.mjs
