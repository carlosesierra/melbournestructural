name: Production SEO monitor

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-seo:
    name: Verify production crawlability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify production SEO and redirects
        env:
          SEO_BASE_URL: https://www.melbournestructural.com.au/
          SEO_CHECK_REDIRECTS: 'true'
          SEO_EXPECTED_CANONICAL: https://www.melbournestructural.com.au/
        run: node scripts/check-seo.mjs
